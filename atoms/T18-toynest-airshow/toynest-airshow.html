<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧸 ToyNest Airshow - 1.2M Flyer Drop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            overflow: hidden;
            height: 100vh;
        }
        
        .sky-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .biplane {
            position: absolute;
            width: 120px;
            height: 60px;
            z-index: 100;
            animation: flyPath 60s ease-in-out infinite;
        }
        
        @keyframes flyPath {
            0% { left: -150px; top: 20%; transform: rotate(-5deg); }
            25% { left: 30%; top: 15%; transform: rotate(0deg); }
            50% { left: 60%; top: 25%; transform: rotate(5deg); }
            75% { left: 85%; top: 20%; transform: rotate(0deg); }
            100% { left: 110%; top: 18%; transform: rotate(-5deg); }
        }
        
        .flyer {
            position: absolute;
            width: 20px;
            height: 30px;
            border-radius: 2px;
            animation: fall linear;
            opacity: 0.9;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .gold { background: linear-gradient(135deg, #FFD700, #FFA500); }
        .pink { background: linear-gradient(135deg, #FF69B4, #FF1493); }
        .blue { background: linear-gradient(135deg, #4169E1, #1E90FF); }
        
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        .header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 200;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            color: #2C3E50;
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            font-size: 1.1em;
            color: #7F8C8D;
        }
        
        .counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 60px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 200;
            text-align: center;
        }
        
        .counter .number {
            font-size: 4em;
            font-weight: bold;
            color: #27AE60;
            font-family: 'Courier New', monospace;
        }
        
        .counter .label {
            font-size: 1.2em;
            color: #7F8C8D;
            margin-top: 10px;
        }
        
        .legend {
            position: absolute;
            top: 150px;
            right: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 200;
        }
        
        .legend h3 {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #2C3E50;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .legend-box {
            width: 30px;
            height: 20px;
            border-radius: 3px;
            margin-right: 10px;
        }
        
        .zone-display {
            position: absolute;
            bottom: 150px;
            left: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 200;
            max-width: 300px;
        }
        
        .zone-display h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #2C3E50;
        }
        
        .zone-info {
            font-size: 0.9em;
            color: #34495E;
            line-height: 1.6;
        }
        
        @media (max-width: 768px) {
            .header h1 { font-size: 1.5em; }
            .counter .number { font-size: 2.5em; }
            .legend, .zone-display {
                font-size: 0.9em;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="sky-container">
        <div class="header">
            <h1>🧸 ToyNest™ Airshow Spectacular</h1>
            <div class="subtitle">1.2 Million Flyers Dropping Across 25 Zones</div>
        </div>
        
        <div class="biplane">
            <svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
                <!-- Vintage Biplane -->
                <rect x="40" y="25" width="50" height="8" fill="#8B4513" rx="2"/>
                <rect x="35" y="35" width="60" height="6" fill="#8B4513" rx="2"/>
                <polygon points="90,28 110,20 110,38 90,30" fill="#CD5C5C"/>
                <circle cx="45" cy="45" r="6" fill="#2C3E50"/>
                <circle cx="80" cy="45" r="6" fill="#2C3E50"/>
                <rect x="42" y="15" width="3" height="12" fill="#8B4513"/>
                <ellipse cx="70" cy="10" rx="25" ry="6" fill="#87CEEB" opacity="0.5"/>
            </svg>
        </div>
        
        <div class="counter">
            <div class="number" id="flyerCount">0</div>
            <div class="label">Flyers Dropped</div>
        </div>
        
        <div class="legend">
            <h3>Elon's 3 Principles</h3>
            <div class="legend-item">
                <div class="legend-box gold"></div>
                <div>✨ TRUTH (400k)</div>
            </div>
            <div class="legend-item">
                <div class="legend-box pink"></div>
                <div>🌸 BEAUTY (400k)</div>
            </div>
            <div class="legend-item">
                <div class="legend-box blue"></div>
                <div>🔬 CURIOSITY (400k)</div>
            </div>
        </div>
        
        <div class="zone-display">
            <h3>Current Zone: <span id="zoneName">HotStack</span></h3>
            <div class="zone-info">
                <div><strong>Sector:</strong> <span id="zoneSector">Build</span></div>
                <div><strong>Flyers:</strong> <span id="zoneFlyers">80,000</span></div>
                <div><strong>Emphasis:</strong> <span id="zoneEmphasis">🔥 Main integration point</span></div>
            </div>
        </div>
    </div>
    
    <script>
        // Flyer counter animation
        let flyerCount = 0;
        const targetCount = 1200000;
        const increment = 347; // To reach 1.2M in ~60s
        const counterElement = document.getElementById('flyerCount');
        
        function updateCounter() {
            if (flyerCount < targetCount) {
                flyerCount = Math.min(flyerCount + increment, targetCount);
                counterElement.textContent = flyerCount.toLocaleString();
                setTimeout(updateCounter, 100);
            }
        }
        
        updateCounter();
        
        // Zones data
        const zones = [
            { name: "HotStack", sector: "Build", flyers: "80,000", emphasis: "🔥 Main integration point, <3 min builds" },
            { name: "BuildNest MONSTER OMNI™", sector: "Build", flyers: "70,000", emphasis: "Chaos processing, dual-service" },
            { name: "ToyNest NEW!", sector: "Build", flyers: "60,000", emphasis: "🧸 NEW smart toy platform, RubikCube, 15% Care Loop" },
            { name: "Banimal Wildlife Rescue", sector: "Health", flyers: "50,000", emphasis: "15% Care Loop destination" },
            { name: "AI-Logic Intent Processing", sector: "AI", flyers: "100,000", emphasis: "Grok/Claude powered" },
            { name: "Fruitful Global Hub Network", sector: "Global", flyers: "150,000", emphasis: "35 sector hubs" },
            { name: "Nexus-Nair & LicenseVault", sector: "Finance", flyers: "40,000", emphasis: "13,713 verified brands" }
        ];
        
        let currentZone = 0;
        
        function updateZone() {
            const zone = zones[currentZone];
            document.getElementById('zoneName').textContent = zone.name;
            document.getElementById('zoneSector').textContent = zone.sector;
            document.getElementById('zoneFlyers').textContent = zone.flyers;
            document.getElementById('zoneEmphasis').textContent = zone.emphasis;
            
            currentZone = (currentZone + 1) % zones.length;
        }
        
        setInterval(updateZone, 8000);
        updateZone();
        
        // Create falling flyers
        const colors = ['gold', 'pink', 'blue'];
        const skyContainer = document.querySelector('.sky-container');
        
        function createFlyer() {
            const flyer = document.createElement('div');
            flyer.className = `flyer ${colors[Math.floor(Math.random() * colors.length)]}`;
            
            flyer.style.left = Math.random() * 100 + '%';
            flyer.style.top = '-30px';
            flyer.style.animationDuration = (Math.random() * 5 + 8) + 's';
            flyer.style.animationDelay = Math.random() * 2 + 's';
            
            skyContainer.appendChild(flyer);
            
            setTimeout(() => {
                flyer.remove();
            }, 15000);
        }
        
        // Create flyers continuously (200 visible at a time as per spec)
        setInterval(createFlyer, 75); // ~200 flyers visible
        
        // Initial burst
        for (let i = 0; i < 200; i++) {
            setTimeout(createFlyer, Math.random() * 2000);
        }
    </script>
</body>
</html>
