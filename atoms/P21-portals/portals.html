<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruitful Portals · Unified Interface</title>
<style>
:root{
  --ink:#231F20; --cream:#FBF4E4; --artcream:#F0EEDA;
  --sage:#577D60; --mint:#A7DACB; --coral:#F16B6E; --rose:#B95F56; --teal:#1E9F97;
  --line:rgba(35,31,32,.12); --shadow:0 14px 40px rgba(35,31,32,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.side{background:var(--ink);color:var(--cream);padding:20px 14px;overflow-y:auto;position:sticky;top:0;height:100vh}
.brand{padding:6px 6px 18px}
.brand .name{font-weight:800;font-size:16px;letter-spacing:-.01em}
.brand .sub{font-size:11px;color:#c9c2bf;margin-top:2px}
.group{margin-bottom:6px}
.group-h{display:flex;align-items:center;justify-content:space-between;padding:9px 8px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#d8d2cf}
.group-h:hover{background:rgba(255,255,255,.06)}
.group-h .cnt{background:rgba(255,255,255,.12);border-radius:999px;padding:1px 7px;font-size:10px}
.group-items{padding-left:4px}
.item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;color:#e7e2df}
.item:hover{background:rgba(255,255,255,.08)}
.item.active{background:var(--teal);color:#fff;font-weight:700}
.item .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.dot.new{background:var(--coral)}
.dot.existing{background:var(--mint)}
main{padding:34px 44px;overflow-y:auto;height:100vh}
.crumbs{font-size:11px;color:#8a8482;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:10px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.tag.existing{background:rgba(167,218,203,.4);color:#2f5544}
.tag.new{background:rgba(241,107,110,.18);color:var(--rose)}
.tag.src{background:#fff;border:1px solid var(--line);color:#5a5452}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);max-width:820px}
.panel p{margin:0 0 12px;color:#4a4442}
.panel code{background:var(--artcream);padding:1px 6px;border-radius:5px;font-size:12.5px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#6a6462;margin-bottom:6px}
.field input,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--cream)}
.result{grid-column:1/-1;background:var(--artcream);border-radius:12px;padding:16px;margin-top:4px}
.result .big{font-size:28px;font-weight:800;color:var(--teal)}
.result .tier{font-size:13px;color:#4a4442;margin-top:6px}
.formula{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--ink);color:var(--mint);padding:12px 14px;border-radius:10px;margin-top:14px;overflow-x:auto}
.hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.hub-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--artcream)}
.hub-card h4{margin:0 0 6px;font-size:14px}
.hub-card p{font-size:12.5px;margin:0;color:#5a5452}
.notice{border-left:4px solid var(--rose);background:#fff;border-radius:0 10px 10px 0;padding:12px 14px;font-size:12.5px;color:#4a4442;margin-top:14px}
.route-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;max-width:1040px}
.route-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);cursor:pointer}
.route-card:hover{border-color:var(--teal)}
.route-card h5{margin:0 0 4px;font-size:13px}
.route-card p{margin:0;font-size:11.5px;color:#6a6462;line-height:1.4}
.route-card .path{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--teal);margin-top:6px;display:block}
.ci-strip{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);max-width:820px;margin-bottom:16px}
.ci-fox{width:34px;height:34px;flex:0 0 auto}
.ci-strip .txt{font-size:11.5px;color:#6a6462}
.ci-strip .txt b{color:var(--ink)}
.ci-swatches{display:flex;gap:3px;margin-left:auto}
.ci-swatches span{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.circle-nav{display:flex;align-items:center;justify-content:space-between;max-width:820px;margin:22px 0 4px;padding:12px 16px;background:var(--ink);color:var(--cream);border-radius:12px}
.circle-nav button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--cream);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer}
.circle-nav button:hover{background:rgba(255,255,255,.16)}
.circle-nav .pos{font-size:11px;color:#c9c2bf;font-family:ui-monospace,Menlo,monospace}
</style>
</head>

const REGISTRY = {

    r("/portals", "Portals", "10-portal directory (SA Bush flagship, NY, Tokyo, TX\u2026).", "src/pages/portals/page.tsx"),
    r("/preview/:id", "Preview", "Generated-app live preview by session id.", "src/pages/preview/page.tsx"),
    r("/profile", "Profile", "User profile management.", "src/pages/profile/page.tsx"),

    r("/settings", "Settings", "Account + workspace settings.", "src/pages/settings/page.tsx"),
    r("/shop", "Shop", "Marketplace storefront (products/combos/specials).", "src/pages/shop/page.tsx"),
    r("/templates", "Templates", "Starter-app template gallery.", "src/pages/templates/page.tsx"),
    r("/workspaces", "Workspaces", "Team workspace + member management.", "src/pages/workspaces/page.tsx"),
  ],
  "Fruitful Kiosk Interface (fruitfulinterface-main, TanStack Start + Supabase)": [
    r("/", "Home", "Kiosk POS attractor screen.", "src/routes/index.tsx"),
    r("/admin", "Admin", "Order/inventory admin root.", "src/routes/admin.tsx"),
    r("/admin/kidswear", "Admin \u00b7 Kidswear", "Bashedi Kidswear catalog CRUD.", "src/routes/admin.kidswear.tsx"),
    r("/admin/orders", "Admin \u00b7 Orders", "Real-time order tracking.", "src/routes/admin.orders.tsx"),
    r("/admin/prints", "Admin \u00b7 Prints", "SamFox Prints gallery CRUD.", "src/routes/admin.prints.tsx"),
    r("/admin/tools", "Admin \u00b7 Tools", "QR/barcode + VAT validation utilities.", "src/routes/admin.tools.tsx"),
    r("/brand", "Brand", "Brand presentation page.", "src/routes/brand.tsx"),
    r("/nexus", "Nexus Overview", "HotStack Nexus \u2014 1.5m Cornice Saver unit economics.", "src/routes/nexus.index.tsx"),
    r("/nexus/approvals", "Nexus Approvals", "Cornice Saver approval workflow.", "src/routes/nexus.approvals.tsx"),
    r("/nexus/items", "Nexus Items", "Cornice Saver item/SKU register.", "src/routes/nexus.items.tsx"),
  ],
};
function r(path,title,desc,src){return{path,title,desc,src,status:"existing"};}
REGISTRY["\u2728 New \u00b7 Giving Loop & Baobab Hub"] = [
  {path:"/giving-loop", title:"Giving Loop \u00b7 15.01%", desc:"Real backend logic activated \u2014 mirrors worker/routes/giving.ts.", src:"NEW", status:"new"},
  {path:"/baobab-hub", title:"Baobab Hub", desc:"Consolidates Baobab Portal + EcoStack + baobab.faa.zone into one space.", src:"NEW", status:"new"},
];
const nav = document.getElementById('nav');
let flat = [];
Object.entries(REGISTRY).forEach(([group, items], gi) => {
  flat = flat.concat(items.map(it=>({...it,group})));
  const g = document.createElement('div'); g.className='group';
  const h = document.createElement('div'); h.className='group-h';
  h.innerHTML = `<span>${group.replace(/^.*?\u00b7\s?/,'').split('(')[0].trim()}</span><span class="cnt">${items.length}</span>`;
  const gi_el = document.createElement('div'); gi_el.className='group-items'; gi_el.style.display = gi===0?'block':'none';
  h.onclick = ()=>{ gi_el.style.display = gi_el.style.display==='none'?'block':'none'; };
  items.forEach(it=>{
    const el = document.createElement('div'); el.className='item'; el.dataset.path = it.path+"::"+group;
    el.innerHTML = `<span class="dot ${it.status}"></span><span>${it.title}</span>`;
    el.onclick = ()=> render(it, group);
    gi_el.appendChild(el);
  });
  g.appendChild(h); g.appendChild(gi_el); nav.appendChild(g);
});
const main = document.getElementById('main');
const CI_PALETTE = ["#231F20","#FBF4E4","#577D60","#A7DACB","#F16B6E","#B95F56","#1E9F97"];
function foxSVG(){
  return `<svg class="ci-fox" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 30 L32 12 L44 26 L50 10 L56 26 L68 12 L80 30 L72 78 L58 92 L50 96 L42 92 L28 78 Z"
      fill="none" stroke="#231F20" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="40" cy="48" rx="8" ry="9" fill="#231F20"/>
    <ellipse cx="61" cy="48" rx="8" ry="9" fill="#231F20"/>
    <circle cx="37" cy="45" r="2" fill="#fff"/><circle cx="58" cy="45" r="2" fill="#fff"/>
    <circle cx="36" cy="60" r="5" fill="#F16B6E" opacity=".8"/>
    <circle cx="64" cy="60" r="5" fill="#F16B6E" opacity=".8"/>
    <circle cx="46" cy="66" r="1.6" fill="#231F20"/><circle cx="50" cy="69" r="1.6" fill="#231F20"/><circle cx="54" cy="66" r="1.6" fill="#231F20"/>
    <path d="M46 74 Q50 78 54 74" fill="none" stroke="#231F20" stroke-width="2.5" stroke-linecap="round"/>
  </svg>`;
}
function ciStrip(routeName){
  return `<div class="ci-strip">
    ${foxSVG()}
    <div class="txt"><b>Sam Fox\u2122 CI Guide \u2014 injected</b><br>Verified palette + fox-mark applied to <b>${routeName}</b>. Six-move construction rules enforced, no off-palette color introduced.</div>
    <div class="ci-swatches">${CI_PALETTE.map(c=>`<span style="background:${c}"></span>`).join('')}</div>
  </div>`;
}
let fullCircle = [];
Object.entries(REGISTRY).forEach(([group, items]) => {
  items.forEach(it => fullCircle.push({...it, group}));
});
function circleIndex(it, group){
  return fullCircle.findIndex(x => x.path===it.path && x.group===group);
}
function circleNav(it, group){
  const idx = circleIndex(it, group);
  const prev = fullCircle[(idx - 1 + fullCircle.length) % fullCircle.length];
  const next = fullCircle[(idx + 1) % fullCircle.length];
  return `<div class="circle-nav">
    <button data-go="${prev.path}::${prev.group}">\u2190 ${prev.title}</button>
    <span class="pos">route ${idx+1} / ${fullCircle.length} \u00b7 full circle</span>
    <button data-go="${next.path}::${next.group}">${next.title} \u2192</button>
  </div>`;
}
function wireCircleNav(){
  document.querySelectorAll('[data-go]').forEach(b=>{
    b.onclick = ()=>{
      const [p,g] = b.dataset.go.split('::');
      const target = REGISTRY[g].find(x=>x.path===p);
      render(target, g);
    };
  });
}
function setActive(path, group){
  document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));
  const el = document.querySelector(`.item[data-path="${CSS.escape(path+"::"+group)}"]`);
  if(el) el.classList.add('active');
}
function render(it, group){
  setActive(it.path, group);
  if(it.path==='/giving-loop') return renderGiving(group);
  if(it.path==='/baobab-hub') return renderBaobab(group);
  main.innerHTML = `
    <div class="crumbs">${group}</div>
    <h1>${it.title}</h1>
    <div class="meta-row">
      <span class="tag ${it.status}">${it.status}</span>
      <span class="tag src">${it.src}</span>
      <span class="tag src">${it.path}</span>
    </div>
    ${ciStrip(it.title)}
    <div class="panel"><p>${it.desc}</p>
      <p style="font-size:12px;color:#8a8482">This route already exists in its source repo. This interface indexes it \u2014 it has not been reduced, merged away, or replaced.</p>
    </div>
    ${circleNav(it, group)}
    <h1 style="font-size:16px;margin-top:32px">All routes in this system</h1>
    <div class="route-grid">
      ${REGISTRY[group].map(x=>`<div class="route-card" data-jump="${x.path}::${group}">
        <h5>${x.title}</h5><p>${x.desc}</p><span class="path">${x.path}</span>
      </div>`).join('')}
    </div>`;
  main.querySelectorAll('[data-jump]').forEach(c=>{
    c.onclick = ()=>{
      const [p,g] = c.dataset.jump.split('::');
      const target = REGISTRY[g].find(x=>x.path===p);
      render(target, g);
    };
  });
  wireCircleNav();
}
const GIVING_RATE = 0.1501;
const VAT_RATE = 0.15;
const TIERS = [
  { minGiving: 0,   item: 'bandana bib',        sku: 'GIVE-BIB' },
  { minGiving: 30,  item: 'babygrow (0\u20133m)',    sku: 'GIVE-BG-03' },
  { minGiving: 60,  item: 'babygrow set',        sku: 'GIVE-BG-SET' },
  { minGiving: 120, item: 'complete layette',    sku: 'GIVE-LAYETTE' },
];
function calculateGiving(orderTotalZAR, includesVAT=true){
  const preTax = includesVAT ? orderTotalZAR/(1+VAT_RATE) : orderTotalZAR;
  const givingAmount = Math.round(preTax*GIVING_RATE*100)/100;
  const tier = [...TIERS].reverse().find(t=>givingAmount>=t.minGiving) || TIERS[0];
  return { preTax: Math.round(preTax*100)/100, givingAmount, tier };
}
function renderGiving(group){
  main.innerHTML = `
    <div class="crumbs">${group}</div>
    <h1>Giving Loop \u00b7 15.01%</h1>
    <div class="meta-row">
      <span class="tag new">new frontend</span>
      <span class="tag existing">backend already existed</span>
      <span class="tag src">worker/routes/giving.ts</span>
    </div>
    <div class="notice"><strong>Correction on the number:</strong> "Banimal Loop 15.01%" as a universal biological/algorithmic/financial threshold (from the research .docx) is unsourced and not real. What <em>is</em> real, and already live in <code>worker/routes/giving.ts</code>: <code>GIVING_RATE = 0.1501</code> \u2014 15.01% of every pre-tax sale is donated as babygrows/bibs/layettes for children in need. This page gives that real mechanism the frontend it never had.</p></div>
    <div class="panel">
      <p>Backend activation: this calculator runs the exact <code>calculateGiving()</code> function already defined server-side, so frontend and Worker can never drift out of agreement.</p>
      <div class="calc">
        <div class="field"><label>Order total (ZAR, incl. VAT)</label><input id="orderTotal" type="number" value="850" min="0" step="1"></div>
        <div class="field"><label>Includes VAT?</label><select id="incVat"><option value="1" selected>Yes \u2014 15% VAT included</option><option value="0">No \u2014 already pre-tax</option></select></div>
        <div class="result" id="givingResult"></div>
      </div>
      <div class="formula">GIVING_RATE = 0.1501
preTax = includesVAT ? total / 1.15 : total
givingAmount = round(preTax \u00d7 GIVING_RATE, 2)
tier = highest TIER where givingAmount >= tier.minGiving</div>
      <p style="margin-top:14px;font-size:12px;color:#8a8482">Live API contract (in-repo, ready to point at the deployed Worker): <code>POST /api/giving/calculate</code> \u2192 <code>{ orderTotalZAR, includesVAT }</code>. Swap the local <code>calculateGiving()</code> call below for a real <code>fetch()</code> once the Worker base URL is confirmed \u2014 same shape, zero rewrite.</p>
    </div>
  `;
  const upd = ()=>{
    const total = Number(document.getElementById('orderTotal').value)||0;
    const inc = document.getElementById('incVat').value === '1';
    const res = calculateGiving(total, inc);
    document.getElementById('givingResult').innerHTML = `
      <div class="big">R${res.givingAmount.toFixed(2)} given</div>
      <div class="tier">Pre-tax base: R${res.preTax.toFixed(2)} \u00d7 15.01% \u2192 funds a <strong>${res.tier.item}</strong> <span style="color:#8a8482">(${res.tier.sku})</span></div>
    `;
  };
  document.getElementById('orderTotal').oninput = upd;
  document.getElementById('incVat').onchange = upd;
  upd();
}
function renderBaobab(group){
  main.innerHTML = `
    <div class="crumbs">${group}</div>
    <h1>Baobab Hub</h1>
    <div class="meta-row">
      <span class="tag new">new: unified space</span>
      <span class="tag existing">pages already existed, scattered</span>
      <span class="tag src">baobab.faa.zone</span>
    </div>
    <div class="panel">
      <p>Baobab already had two live pages in <code>banimal-main</code> \u2014 <code>/baobab-portal</code> and <code>/baobab-ecostack</code> \u2014 wired into <code>App.tsx</code>, but with no single door into them and no link out to the <code>baobab.faa.zone</code> repo itself. This hub gives Baobab one frontend space and one backend activation point, without touching either existing page.</p>
      <div class="hub-grid">
        <div class="hub-card" onclick="render(REGISTRY['Banimal \u00b7 Worker Ecosystem (banimal-main, React Router + Hono)'].find(x=>x.path==='/baobab-portal'),'Banimal \u00b7 Worker Ecosystem (banimal-main, React Router + Hono)')" style="cursor:pointer">
          <h4>\ud83c\udf33 Baobab Portal</h4>
