<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seedwave™ Global Admin Panel - Dashboard Selector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
        }
        .dashboard-card {
            transition: all 0.3s ease;
        }
        .dashboard-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }
        .category-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .admin-badge { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; }
        .sector-badge { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; }
        .planet-badge { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
    </style>
</head>
<body class="gradient-bg min-h-screen">

    <!-- Top Navigation -->
    <nav class="bg-gray-900/50 backdrop-blur-lg border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl font-extrabold text-white">Seedwave™</h1>
                    <span class="text-sm text-gray-400">Global Admin Panel</span>
                </div>

                <!-- Search Bar -->
                <div class="flex-1 max-w-xl mx-8">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search dashboards..."
                        class="w-full px-4 py-2 bg-gray-800 text-white border border-gray-700 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                    />
                </div>

                <!-- User Menu -->
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-xs text-gray-400">VaultMesh™</span>
                    </div>
                    <div class="text-right">
                        <p id="userName" class="text-sm font-semibold text-white">Loading...</p>
                        <p id="userRole" class="text-xs text-gray-400">...</p>
                    </div>
                    <button
                        id="logoutButton"
                        class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-semibold rounded-lg transition"
                    >
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Header -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-white mb-2">Select Dashboard</h2>
            <p class="text-gray-400">Access all 50+ dashboards across Admin, Seedwave Sectors, and Fruitful Planet</p>
        </div>

        <!-- Category Tabs -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <button class="category-tab active px-4 py-2 bg-purple-600 text-white rounded-lg font-semibold whitespace-nowrap" data-category="all">
                All Dashboards
            </button>
            <button class="category-tab px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-semibold whitespace-nowrap" data-category="admin">
                Admin Panels (8)
            </button>
            <button class="category-tab px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-semibold whitespace-nowrap" data-category="sector">
                Seedwave Sectors (31)
            </button>
            <button class="category-tab px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-semibold whitespace-nowrap" data-category="planet">
                Fruitful Planet (13)
            </button>
        </div>

        <!-- Dashboard Grid -->
        <div id="dashboardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Dashboards will be inserted here -->
        </div>

        <!-- No Results Message -->
        <div id="noResults" class="hidden text-center py-12">
            <p class="text-gray-400 text-lg">No dashboards found</p>
        </div>

    </main>

    <script>
        // Dashboard data
        const dashboards = [
            // Admin Panels (8)
            { name: 'Admin Panel', url: 'admin-panel.html', category: 'admin', description: 'Main admin control panel' },
            { name: 'Admin Portal', url: 'admin-portal.html', category: 'admin', description: 'Admin portal access' },
            { name: 'Admin License Ledger', url: 'admin-license-ledger.html', category: 'admin', description: 'License management' },
            { name: 'Heyns Admin Panel', url: 'heyns_admin_panel.html', category: 'admin', description: 'Personal admin panel' },
            { name: 'Heyns Admin Panel (PayPal)', url: 'heyns_admin_panel_paypal.html', category: 'admin', description: 'PayPal integration' },
            { name: 'Admin Panel (Xero)', url: 'admin_panel_xero.html', category: 'admin', description: 'Xero accounting' },
            { name: 'Ecosystem Dashboard', url: 'ecosystem-dashboard.html', category: 'admin', description: 'Ecosystem overview' },
            { name: 'Fruitful Dashboard', url: 'fruitful_dashboard.html', category: 'admin', description: 'Fruitful metrics' },

            // Seedwave Sectors (31)
            { name: '🌱 Agriculture', url: 'sectors/agriculture/', category: 'sector', description: 'Agriculture & Biotech' },
            { name: '🧠 AI Logic', url: 'sectors/ai-logic/', category: 'sector', description: 'AI, Logic & Grid' },
            { name: '🏦 Banking', url: 'sectors/banking/', category: 'sector', description: 'Banking & Finance' },
            { name: '📚 Education IP', url: 'sectors/education-ip/', category: 'sector', description: 'Education & IP' },
            { name: '🎓 Education Youth', url: 'sectors/education-youth/', category: 'sector', description: 'Youth Education' },
            { name: '🥦 FSF', url: 'sectors/fsf/', category: 'sector', description: 'Food, Soil & Farming' },
            { name: '🏗️ Housing', url: 'sectors/housing/', category: 'sector', description: 'Housing & Infrastructure' },
            { name: '📖 Knowledge', url: 'sectors/knowledge/', category: 'sector', description: 'Knowledge & Archives' },
            { name: '📦 Logistics', url: 'sectors/logistics/', category: 'sector', description: 'Logistics & Packaging' },
            { name: '🎬 Media', url: 'sectors/media/', category: 'sector', description: 'Motion, Media & Sonic' },
            { name: '🎙️ Media Sonic', url: 'sectors/media-sonic/', category: 'sector', description: 'Audio & Sound' },
            { name: '☰ Micromesh', url: 'sectors/micromesh/', category: 'sector', description: 'Micro-Mesh Logistics' },
            { name: '⛏️ Mining', url: 'sectors/mining/', category: 'sector', description: 'Mining & Resources' },
            { name: '✿ Nutrition', url: 'sectors/nutrition/', category: 'sector', description: 'Nutrition & Food Chain' },
            { name: '🪙 Payroll Mining', url: 'sectors/payroll-mining/', category: 'sector', description: 'Payroll & Mining' },
            { name: '🧾 Professional', url: 'sectors/professional/', category: 'sector', description: 'Professional Services' },
            { name: '✴️ Quantum', url: 'sectors/quantum/', category: 'sector', description: 'Quantum Protocols' },
            { name: '☯ Ritual', url: 'sectors/ritual/', category: 'sector', description: 'Ritual & Culture' },
            { name: '🔑 SaaS', url: 'sectors/saas/', category: 'sector', description: 'SaaS & Licensing' },
            { name: '🧸 ToyNest', url: 'sectors/toynest/', category: 'sector', description: 'Toys & Play' },
            { name: '🧺 Trade', url: 'sectors/trade/', category: 'sector', description: 'Trade Systems' },
            { name: '🔋 Utilities', url: 'sectors/utilities/', category: 'sector', description: 'Utilities & Energy' },
            { name: '🎙️ Voice', url: 'sectors/voice/', category: 'sector', description: 'Voice & Audio' },
            { name: '📡 Webless', url: 'sectors/webless/', category: 'sector', description: 'Webless Tech & Nodes' },
            { name: '🦁 Wildlife', url: 'sectors/wildlife/', category: 'sector', description: 'Wildlife & Habitat' },
            { name: '♻️ Zero Waste', url: 'sectors/zerowaste/', category: 'sector', description: 'Zero Waste' },
            { name: '⚖️ Justice', url: 'sectors/justice/', category: 'sector', description: 'Justice & Ethics' },
            { name: '🎓 Interns', url: 'sectors/interns/', category: 'sector', description: 'Internship Program' },
            { name: '☰ Menu', url: 'sectors/menu/', category: 'sector', description: 'Menu System' },
            { name: '📊 Index', url: 'sectors/index/', category: 'sector', description: 'Sector Index' },
            { name: '🧾 Payroll Mining Org', url: 'sectors/payroll-mining-org/', category: 'sector', description: 'Payroll Organization' },

            // Fruitful Planet Dashboards (13)
            { name: '🌬️ Air Quality', url: 'planet/air-quality', category: 'planet', description: 'Air quality monitoring' },
            { name: '🌳 Baobab SPA', url: 'planet/baobab-spa', category: 'planet', description: 'Baobab security network' },
            { name: '🤝 Community Resilience', url: 'planet/community-resilience', category: 'planet', description: 'Community support' },
            { name: '🌲 Deforestation', url: 'planet/deforestation', category: 'planet', description: 'Forest conservation' },
            { name: '💼 Economic Empowerment', url: 'planet/economic-empowerment', category: 'planet', description: 'Economic development' },
            { name: '⚡ Energy Optimization', url: 'planet/energy-optimization', category: 'planet', description: 'Energy efficiency' },
            { name: '🔌 Eskom Crisis', url: 'planet/eskom-crisis', category: 'planet', description: 'Energy crisis management' },
            { name: '🏥 Global Health', url: 'planet/global-health', category: 'planet', description: 'Health monitoring' },
            { name: '🏜️ Land Degradation', url: 'planet/land-degradation', category: 'planet', description: 'Land restoration' },
            { name: '🌊 Ocean Plastic', url: 'planet/ocean-plastic', category: 'planet', description: 'Ocean cleanup' },
            { name: '📊 Resource Management', url: 'planet/resource-management', category: 'planet', description: 'Resource tracking' },
            { name: '💧 Water Security', url: 'planet/water-security', category: 'planet', description: 'Water access' },
            { name: '🦁 Wildlife Protection', url: 'planet/wildlife-protection', category: 'planet', description: 'Wildlife conservation' },
        ];

        let currentUser = null;
        let currentCategory = 'all';
        let searchQuery = '';

        // Initialize
        async function init() {
            await checkAuth();
            setupEventListeners();
            renderDashboards();
        }

        // Check authentication
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/status');
                const data = await response.json();

                if (!data.authenticated) {
                    window.location.href = 'login.html';
                    return;
                }

                currentUser = data.user;
                document.getElementById('userName').textContent = `${currentUser.firstName} ${currentUser.lastName}`;
                document.getElementById('userRole').textContent = currentUser.role.toUpperCase();
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = 'login.html';
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            // Logout button
            document.getElementById('logoutButton').addEventListener('click', async () => {
                try {
                    await fetch('/api/auth/logout', { method: 'POST' });
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error('Logout error:', error);
                }
            });

            // Search
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderDashboards();
            });

            // Category tabs
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentCategory = tab.dataset.category;

                    // Update active state
                    document.querySelectorAll('.category-tab').forEach(t => {
                        t.classList.remove('active', 'bg-purple-600');
                        t.classList.add('bg-gray-700', 'hover:bg-gray-600');
                    });
                    tab.classList.add('active', 'bg-purple-600');
                    tab.classList.remove('bg-gray-700', 'hover:bg-gray-600');

                    renderDashboards();
                });
            });
        }

        // Render dashboards
        function renderDashboards() {
            const grid = document.getElementById('dashboardGrid');
            const noResults = document.getElementById('noResults');

            // Filter dashboards
            const filtered = dashboards.filter(d => {
                const matchesCategory = currentCategory === 'all' || d.category === currentCategory;
                const matchesSearch = d.name.toLowerCase().includes(searchQuery) ||
                                    d.description.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            // Show/hide no results
            if (filtered.length === 0) {
                grid.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            } else {
                grid.classList.remove('hidden');
                noResults.classList.add('hidden');
            }

            // Render cards
            grid.innerHTML = filtered.map(d => createDashboardCard(d)).join('');

            // Add click listeners
            document.querySelectorAll('.dashboard-card').forEach(card => {
                card.addEventListener('click', async () => {
                    const url = card.dataset.url;
                    const name = card.dataset.name;

                    // Log activity
                    try {
                        await fetch('/api/auth/log-activity', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                action: 'access_dashboard',
                                metadata: { dashboard: name, url }
                            })
                        });
                    } catch (error) {
                        console.error('Log error:', error);
                    }

                    // Navigate
                    window.location.href = url;
                });
            });
        }

        // Create dashboard card HTML
        function createDashboardCard(dashboard) {
            const categoryBadges = {
                admin: 'admin-badge',
                sector: 'sector-badge',
                planet: 'planet-badge'
            };

            const categoryNames = {
                admin: 'Admin',
                sector: 'Sector',
                planet: 'Planet'
            };

            return `
                <div class="dashboard-card bg-gray-800 rounded-lg p-6 cursor-pointer border border-gray-700 hover:border-purple-500"
                     data-url="${dashboard.url}"
                     data-name="${dashboard.name}">
                    <div class="flex items-start justify-between mb-3">
                        <h3 class="text-lg font-bold text-white">${dashboard.name}</h3>
                        <span class="category-badge ${categoryBadges[dashboard.category]}">${categoryNames[dashboard.category]}</span>
                    </div>
                    <p class="text-gray-400 text-sm">${dashboard.description}</p>
                    <div class="mt-4 flex items-center gap-2 text-xs text-gray-500">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd"/>
                        </svg>
                        <span>Click to access</span>
                    </div>
                </div>
            `;
        }

        // VaultMesh Pulse (9-second)
        setInterval(() => {
            const pulse = document.querySelector('.animate-pulse');
            if (pulse) {
                pulse.style.animation = 'none';
                setTimeout(() => pulse.style.animation = '', 10);
            }
        }, 9000);

        // Initialize on load
        init();
    </script>

</body>
</html>
