<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeNest — Research &amp; Brief</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo-row">
      <span class="brand">CodeNest</span>
      <span class="tag">Powered by Fruitful Perplexity Gateway™</span>
    </div>
    <div class="workspace-row">
      <label for="workspace">Workspace</label>
      <select id="workspace">
        <option value="codenest">CodeNest</option>
        <option value="faa-zone">FAA.ZONE</option>
        <option value="banimal">Banimal</option>
      </select>
    </div>
  </header>

  <main>
    <nav class="mode-tabs">
      <button class="tab active" data-mode="research">Research</button>
      <button class="tab" data-mode="brief">Brief</button>
    </nav>

    <!-- Research panel -->
    <section id="panel-research" class="panel active">
      <div class="field-row">
        <input id="r-query" type="text" placeholder="Research query…" />
        <input id="r-brand" type="text" placeholder="Brand (optional)" />
        <input id="r-sector" type="text" placeholder="Sector (optional)" />
        <select id="r-depth">
          <option value="512">Quick (512 tok)</option>
          <option value="1024" selected>Standard (1024 tok)</option>
          <option value="2048">Deep (2048 tok)</option>
        </select>
        <button id="r-submit" class="btn-primary">Research</button>
      </div>
      <div id="r-result" class="result-box hidden"></div>
      <div id="r-citations" class="citations hidden"></div>
    </section>

    <!-- Brief panel -->
    <section id="panel-brief" class="panel hidden">
      <div class="field-row">
        <input id="b-topic" type="text" placeholder="Topic for brief…" />
        <select id="b-audience">
          <option value="executive">Executive</option>
          <option value="technical">Technical</option>
          <option value="general">General</option>
        </select>
        <select id="b-depth">
          <option value="surface">Surface</option>
          <option value="standard" selected>Standard</option>
          <option value="deep">Deep</option>
        </select>
        <input id="b-brand" type="text" placeholder="Brand (optional)" />
        <button id="b-submit" class="btn-primary">Generate Brief</button>
      </div>
      <div id="b-result" class="result-box hidden"></div>
      <div id="b-citations" class="citations hidden"></div>
    </section>

    <div id="meta-bar" class="meta-bar hidden">
      <span id="meta-model"></span>
      <span id="meta-tokens"></span>
      <span id="meta-latency"></span>
      <span class="meta-watermark">GC7:FSP2021121654:4400302974:VM9s:BL1501:GHOST7CHAIN:FAA13713</span>
    </div>

    <div id="error-box" class="error-box hidden"></div>
    <div id="spinner" class="spinner hidden">Querying gateway…</div>
  </main>

  <footer>
    &copy; 2021–2026 Fruitful Shops (Pty) Ltd &middot; Reg: 2021/121654/07 &middot; VAT: 4400302974
  </footer>

  <script src="panel.js"></script>
</body>
</html>
