<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seedwave™ - Global Pulse & Master Brands</title>
    <link rel="icon" href="https://placehold.co/16x16/00e393/ffffff?text=SW">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.js"></script>
    <style>
        :root { --dark-bg: #0a0a0d; --primary-glow: #00e393; --page-bg-light: #ffffff; --page-text-dark: #000000; }
        body { font-family: 'Inter', sans-serif; background-color: var(--page-bg-light); color: var(--page-text-dark); min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #0a0a0d; border-bottom: 1px solid #3a3a42; padding: 1rem 2rem; position: sticky; top: 0; z-index: 50; display: flex; justify-content: space-between; align-items: center; }
        .hero-section { position: relative; height: 90vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background-color: var(--dark-bg); }
        section { padding: 6rem 2rem; background-color: var(--page-bg-light); border-top: 1px solid #cccccc; text-align: center; }
        .master-brand-block { background-color: #ffffff; border-radius: 1rem; padding: 2.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #cccccc; text-decoration: none; color: #000; display: flex; align-items: center; justify-content: center; }
        .master-brand-block h3 { font-size: 2rem; font-weight: 900; margin: 0; }
    </style>
</head>
<body>
    <header>
        <div style="display:flex;align-items:center;gap:10px;">
            <a href="#" style="color:#fff;font-size:1.6rem;font-weight:800;text-decoration:none;">Fruitful™</a>
            <span style="color:#bbb;font-size:1.4rem;font-weight:600;">|</span>
            <span style="color:#fff;font-size:1.6rem;font-weight:800;">Seedwave™</span>
        </div>
        <canvas id="header-pulse-canvas" style="flex-grow:1;height:40px;background:transparent;margin:0 20px;max-width:600px;"></canvas>
    </header>
    <main>
        <section class="hero-section" id="pulse">
            <a href="#" style="display:inline-flex;align-items:center;padding:0.5rem 1.5rem;background:#fff;color:#000;border-radius:1rem;font-weight:700;font-size:1.1rem;text-decoration:none;margin-bottom:2rem;">Discover the Future</a>
        </section>
        <section id="operational-pillars">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2.5rem;max-width:1200px;margin:0 auto;">
                <div style="background:#fff;border-radius:1rem;padding:2.5rem;box-shadow:0 4px 15px rgba(0,0,0,0.08);border:1px solid #ccc;text-align:center;"><h3 style="font-size:2rem;font-weight:900;">Auto Design</h3></div>
                <div style="background:#fff;border-radius:1rem;padding:2.5rem;box-shadow:0 4px 15px rgba(0,0,0,0.08);border:1px solid #ccc;text-align:center;"><h3 style="font-size:2rem;font-weight:900;">Auto Build</h3></div>
                <div style="background:#fff;border-radius:1rem;padding:2.5rem;box-shadow:0 4px 15px rgba(0,0,0,0.08);border:1px solid #ccc;text-align:center;"><h3 style="font-size:2rem;font-weight:900;">Auto Deploy</h3></div>
            </div>
        </section>
        <section id="master-brands">
            <h2 style="font-size:3rem;font-weight:800;max-width:800px;margin:0 auto 3rem;">Seedwave™ Global Master License Brands</h2>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2.5rem;max-width:1200px;margin:0 auto;">
                <a href="https://samfox.faa.zone" target="_blank" class="master-brand-block"><h3>Samfox™</h3></a>
                <a href="https://seedwave.faa.zone" target="_blank" class="master-brand-block"><h3>Seedwave™</h3></a>
                <a href="https://faa.zone/" target="_blank" class="master-brand-block"><h3>FAA.ZONE™</h3></a>
            </div>
        </section>
    </main>
    <footer style="background:#f5f5f7;border-top:1px solid #ccc;padding:2.5rem;text-align:center;color:#333;font-size:0.9rem;"></footer>
</body>
</html>
