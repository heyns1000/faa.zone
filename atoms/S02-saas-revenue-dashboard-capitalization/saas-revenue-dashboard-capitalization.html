<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAA™ SaaS Revenue Dashboard: Global Capitalization</title>
    <link rel="icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; margin: 0; }
        h1 { font-size: 3.2rem; font-weight: 900; color: #4f46e5; text-align: center; margin-bottom: 1.5rem; }
        .metric-card { background: linear-gradient(145deg,#eef2ff,#e0e7ff); border: 1px solid #c7d2fe; border-radius: 0.75rem; padding: 1.5rem; text-align: center; }
        .metric-card .value { font-size: 3.5rem; font-weight: 900; color: #4f46e5; }
    </style>
</head>
<body>
    <header style="background:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:2.5rem;font-weight:800;color:#4f46e5;">Fruitful™</span>
        <h1 style="font-size:1.5rem;margin:0;">FAA™ SaaS Dashboard</h1>
    </header>
    <main style="max-width:1200px;margin:2rem auto;padding:2.5rem;background:#fff;border-radius:1.5rem;border-top:8px solid #4f46e5;">
        <h1>TOTAL FAA™ SAAS REVENUE (FULL 12-MONTH CYCLE)</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="metric-card"><div class="value">2,612,824</div><div style="font-size:1.2rem;color:#3730a3;font-weight:700;">Total Global Units</div></div>
            <div class="metric-card"><div class="value">$885,291,835</div><div style="font-size:1.2rem;color:#3730a3;font-weight:700;">Total Global Annual SaaS Capital</div></div>
        </div>
    </main>
</body>
</html>
