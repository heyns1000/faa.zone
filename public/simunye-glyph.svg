<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- SIMUNYE Protocol Glyph - Ubuntu Infinity Symbol -->
  <defs>
    <linearGradient id="sunriseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ndebeleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Circle - Unity -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#ndebeleGradient)" stroke-width="3" opacity="0.3"/>
  
  <!-- Ndebele Geometric Pattern Background -->
  <path d="M 30,30 L 40,30 L 40,40 L 30,40 Z" fill="#667eea" opacity="0.2"/>
  <path d="M 80,30 L 90,30 L 90,40 L 80,40 Z" fill="#764ba2" opacity="0.2"/>
  <path d="M 30,80 L 40,80 L 40,90 L 30,90 Z" fill="#764ba2" opacity="0.2"/>
  <path d="M 80,80 L 90,80 L 90,90 L 80,90 Z" fill="#667eea" opacity="0.2"/>
  
  <!-- Ubuntu Infinity Symbol - Cultural Pathways -->
  <path d="M 30,60 Q 30,40 45,40 Q 60,40 60,60 Q 60,80 75,80 Q 90,80 90,60 Q 90,40 75,40 Q 60,40 60,60" 
        fill="none" stroke="url(#sunriseGradient)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Animal Paw Print in Center -->
  <g transform="translate(60, 60)">
    <!-- Main pad -->
    <ellipse cx="0" cy="2" rx="8" ry="10" fill="url(#sunriseGradient)"/>
    <!-- Top left toe -->
    <circle cx="-8" cy="-8" r="4" fill="url(#sunriseGradient)"/>
    <!-- Top center toe -->
    <circle cx="0" cy="-10" r="4" fill="url(#sunriseGradient)"/>
    <!-- Top right toe -->
    <circle cx="8" cy="-8" r="4" fill="url(#sunriseGradient)"/>
  </g>
  
  <!-- Cultural Nodes - 13,320 pathways represented -->
  <circle cx="30" cy="60" r="5" fill="#FFD700" opacity="0.8"/>
  <circle cx="90" cy="60" r="5" fill="#FFD700" opacity="0.8"/>
  <circle cx="60" cy="30" r="5" fill="#FFA500" opacity="0.8"/>
  <circle cx="60" cy="90" r="5" fill="#FFA500" opacity="0.8"/>
  
  <!-- Connecting Lines - Heritage Matrix -->
  <line x1="30" y1="60" x2="60" y2="30" stroke="#667eea" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="30" x2="90" y2="60" stroke="#667eea" stroke-width="1" opacity="0.3"/>
  <line x1="90" y1="60" x2="60" y2="90" stroke="#764ba2" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="90" x2="30" y2="60" stroke="#764ba2" stroke-width="1" opacity="0.3"/>
</svg>
